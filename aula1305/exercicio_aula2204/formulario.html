<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>
    <link rel="stylesheet" href="../estilos/bootstrap.min.css">
</head>

<body>
    <header class="container border border-warning border-3">
        <h1 class="display-4 text-center">Escola Virtual</h1>
        <h3 class="display-6 text-center">Formulário de Pré-Matrícula</h3>
    </header>
    <main class="container mt-3">
        <form>
            <fieldset class="border border-secondary p-5">
                <legend>Dados Pessoais</legend>
                <div class="form-floating mb-3">
                    <input type="text" name="nome" id="nome" class="form-control" placeholder="">
                    <label for="nome" class="label">Seu nome aqui</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="date" name="dtnasc" id="dtnasc" class="form-control" placeholder="">
                    <label for="dtnasc" class="label">Nascimento (dd/mm/aaaa)</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" name="nomemae" id="nomemae" class="form-control" placeholder="">
                    <label for="nomemae" class="label">Nome da Mãe</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" name="nomepai" id="nomepai" class="form-control" placeholder="">
                    <label for="nomepai" class="label">Nome do Pai</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" name="tel" id="tel" class="form-control" placeholder=""
                        pattern="(\d{2})\d{5}-\d{4}">
                    <label for="tel" class="label">Telefone</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" name="email" id="email" class="form-control" placeholder="">
                    <label for="email" class="label">E-mail</label>
                </div>

            </fieldset>
            <fieldset class="border border-secondary p-5 mt-3">
                <legend>Informações da Matrícula</legend>
                <div class="row">
                    <div class="col-sm-4">
                        <label class="label" for="serie">Série</label>
                        <select name="serie" id="serie" class="form-control">
                            <option selected disabled>Selecione...</option>
                            <option value="ps">Pré-escolar</option>
                            <option value="ef">Ensino Fundamental</option>
                            <option value="em">Ensino Médio</option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <h4>Turno</h4>
                        <input type="radio" name="turno" id="turno1" value="matutino" class="radio">Matutino<br>
                        <input type="radio" name="turno" id="turno2" value="vespertino" class="radio">Vespertino
                    </div>
                    <div class="col-sm-4">
                        <h4>Atividades Extracurriculares</h4>
                        <div class="form-check">
                            <input type="checkbox" name="informatica" id="info" class="form-check-input">Informática
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="musica" id="musica" class="form-check-input">Música
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="balet" id="balet" class="form-check-input">Balet
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="pintura" id="pintura" class="form-check-input">Pintura
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="judo" id="judo" class="form-check-input">Judô
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="border border-secondary p-5 mt-3">
                <button type="submit" class="btn btn-primary">Enviar Formulário</button>
                <button type="reset" class="btn btn-warning">Limpar Formulário</button>
            </fieldset>
        </form>
    </main>
    <script src="meuform.js"></script>
</body>

</html>
